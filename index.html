<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran Audio</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#050b1c;
  color:white;
  min-height:100vh;
}
.app{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%,#173b72 0,transparent 35%),
    radial-gradient(circle at 85% 65%,#32145e 0,transparent 38%),
    #050b1c;
}
header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}
.logo{font-size:20px;font-weight:bold}
.top{
  display:flex;
  gap:10px;
  align-items:center;
}
.top button{
  border:0;
  background:none;
  color:white;
  font-size:14px;
}
.menu-btn{font-size:25px!important}
.screen{
  display:none;
  min-height:calc(100vh - 125px);
  padding:15px 20px 90px;
}
.screen.active{display:block}

.hero{
  height:430px;
  border-radius:28px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:28px;
  background:
    linear-gradient(transparent 30%,rgba(3,8,25,.95)),
    url("https://images.unsplash.com/photo-1519817650390-64a93db511aa?auto=format&fit=crop&w=900&q=80")
    center/cover;
  box-shadow:0 0 35px rgba(40,150,255,.18);
}
.hero h1{font-size:28px;margin-bottom:10px}
.hero p{color:#c8d4e8;margin-bottom:20px}

.main-btn{
  border:0;
  border-radius:16px;
  padding:16px;
  color:white;
  font-size:16px;
  font-weight:bold;
  background:linear-gradient(135deg,#168cff,#7c3cff);
  box-shadow:0 0 22px rgba(74,130,255,.35);
}

.lesson{text-align:center}
.lesson h2{font-size:25px;margin:25px 0 8px}
.arabic{font-size:34px;margin:25px 0 8px}
.translation{color:#aebbd0;margin-bottom:30px}
.progress{
  height:6px;
  background:#25304b;
  border-radius:10px;
  margin-bottom:30px;
}
.progress span{
  display:block;
  width:0%;
  height:100%;
  border-radius:10px;
  background:#28d6ff;
}
.controls{
  display:flex;
  justify-content:center;
  gap:14px;
}
.controls button{
  width:85px;
  height:58px;
  border:0;
  border-radius:17px;
  color:white;
  font-weight:bold;
  box-shadow:0 0 20px rgba(0,0,0,.25);
}
.play{background:#18a957}
.stop{background:#e5394f}
.repeat{background:#8639d9}

.menu{
  background:rgba(9,17,39,.97);
  border-radius:25px;
  padding:15px;
  box-shadow:0 0 35px rgba(0,170,255,.15);
}
.menu-item{
  width:100%;
  padding:19px 15px;
  border:0;
  border-bottom:1px solid #26304a;
  background:none;
  color:white;
  text-align:left;
  font-size:16px;
}
.menu-item:last-child{border:0}

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(480px,100%);
  height:60px;
  display:flex;
  justify-content:center;
  gap:70px;
  align-items:center;
  background:rgba(5,11,28,.96);
  border-top:1px solid #202b46;
}
nav button{
  background:none;
  border:0;
  color:#b9c5d9;
  font-size:15px;
}
nav button.active{color:#4fcfff}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">Quran Audio</div>
  <div class="top">
    <button onclick="setLanguage()">Taal</button>
    <button onclick="setTheme()">Thema</button>
    <button class="menu-btn" onclick="show('menu')">☰</button>
  </div>
</header>

<section id="home" class="screen active">
  <div class="hero">
    <h1 id="welcome">Welkom bij Quran Audio</h1>
    <p>Luister en leer op je eigen tempo.</p>
    <button class="main-btn" onclick="show('lessons')">Ga naar de lessen</button>
  </div>
</section>

<section id="lessons" class="screen">
  <div class="lesson">
    <h2 id="lessonTitle">Les 1 – An-Nas</h2>
    <div class="arabic">سُورَةُ النَّاسِ</div>
    <div class="translation">De mensen</div>

    <div class="progress">
      <span id="bar"></span>
    </div>

    <div class="controls">
      <button class="play" onclick="playPause()">▶ Play</button>
      <button class="stop" onclick="stopAudio()">■ Stop</button>
      <button class="repeat" onclick="repeatAudio()">↻ Herhalen</button>
    </div>
  </div>
</section>

<section id="menu" class="screen">
  <div class="menu">
    <button class="menu-item">🎙 Stem kiezen</button>
    <button class="menu-item">⚙ Instellingen</button>
    <button class="menu-item">ℹ Over deze app</button>
    <button class="menu-item">♡ Steun de app</button>
    <button class="menu-item">🔒 Privacy</button>
    <button class="menu-item">❓ Help & contact</button>
  </div>
</section>

<nav>
  <button id="homeNav" class="active" onclick="show('home')">Home</button>
  <button id="lessonNav" onclick="show('lessons')">Lessen</button>
</nav>

<audio id="audio" src="114.mp3"></audio>

</div>

<script>
const audio=document.getElementById("audio");
const bar=document.getElementById("bar");

function show(page){
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.getElementById(page).classList.add("active");

  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  if(page==="home") document.getElementById("homeNav").classList.add("active");
  if(page==="lessons") document.getElementById("lessonNav").classList.add("active");
}

function playPause(){
  if(audio.paused) audio.play();
  else audio.pause();
}

function stopAudio(){
  audio.pause();
  audio.currentTime=0;
  bar.style.width="0%";
}

function repeatAudio(){
  audio.currentTime=0;
  audio.play();
}

audio.addEventListener("timeupdate",()=>{
  if(audio.duration){
    bar.style.width=(audio.currentTime/audio.duration*100)+"%";
  }
});

function setLanguage(){
  const lang=prompt("NL / EN / SO / AR");
  if(lang==="EN"){
    document.getElementById("welcome").textContent="Welcome to Quran Audio";
  }
  if(lang==="SO"){
    document.getElementById("welcome").textContent="Ku soo dhowow Quran Audio";
  }
  if(lang==="AR"){
    document.getElementById("welcome").textContent="مرحباً بك في Quran Audio";
  }
  if(lang==="NL"){
    document.getElementById("welcome").textContent="Welkom bij Quran Audio";
  }
}

function setTheme(){
  const theme=prompt("dark / light / green");
  if(theme==="light"){
    document.body.style.background="#f4f7fb";
    document.querySelector(".app").style.background="#f4f7fb";
    document.querySelector(".app").style.color="#111827";
  }
  if(theme==="dark"){
    document.body.style.background="#050b1c";
    document.querySelector(".app").style.background="#050b1c";
    document.querySelector(".app").style.color="white";
  }
  if(theme==="green"){
    document.body.style.background="#06150d";
    document.querySelector(".app").style.background="#06150d";
  }
}
</script>

</body>
</html>
